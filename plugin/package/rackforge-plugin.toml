schema_version = 3
id = "org.rackforge.rf-comp"
name = "RF-Comp"
short_name = "RF-CMP"
vendor = "RackForge Community"
version = "0.1.0"
description = "A feed-forward stereo compressor: threshold, ratio and a soft knee, peak or RMS detection, a filtered sidechain, stereo link, parallel mix, and a gain-reduction meter."
kind = "effect"
state_version = 1
capabilities = [
    "audio_input",
    "audio_output",
    "presets",
    "state",
    "sample_accurate_automation",
]
config_mode = false

[audio]
input_buses = [{ id = "main", name = "In", channels = 2, layout = "stereo" }]
output_buses = [{ id = "main", name = "Out", channels = 2, layout = "stereo" }]

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[api]
major = 1
minor = 9

[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#0E1216"
accent_color = "#E8A33D"

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"
