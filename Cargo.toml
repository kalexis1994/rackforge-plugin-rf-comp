[workspace]
resolver = "3"
members = [
    "crates/rf-comp-contract",
    "crates/rf-comp-dsp",
    "crates/rf-comp-lab",
    "plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/kalexis1994/rackforge-plugin-rf-comp"

[workspace.dependencies]
rf-comp-contract = { path = "crates/rf-comp-contract" }
rf-comp-dsp = { path = "crates/rf-comp-dsp" }
libm = "0.2"

# Portable RackForge ABI used by the processor adapter. Local contributors can
# override this revision with `.cargo/config.toml.example`.
rackforge-plugin-sdk = { git = "https://github.com/kalexis1994/rackforge.git", rev = "566597d59b0e80657b0adb7a1d439e4b3ecd6013" }

# The host's own runtime, used by one test: the packaged component must be able
# to start. See crates/rf-comp-lab/tests/component_instantiates.rs.
rackforge-plugin-runtime = { git = "https://github.com/kalexis1994/rackforge.git", rev = "566597d59b0e80657b0adb7a1d439e4b3ecd6013" }
